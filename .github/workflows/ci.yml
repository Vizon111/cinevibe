name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    needs: build
    # Secrets aren't available to PRs from forks — skip e2e so CI doesn't break for external contributors
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      - run: npm run test:e2e
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
